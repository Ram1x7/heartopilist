}

.update-head-text{

.update-date-badge{

  padding:2px 9px;

body.dark .update-date-badge{
  background:var(--dark-card-alt);
  color:var(--dark-text-sub);
}

.update-title{

  font-weight:700;
  color:var(--text);
  line-height:1.6;
}

body.dark .update-title{
  color:var(--dark-text);
}

.update-arrow{
  flex-shrink:0;
  font-size:11px;
  color:var(--text-sub);
  transition:transform 0.2s;
  margin-top:2px;
}

body.dark .update-arrow{
  color:var(--dark-text-sub);
}

.update-card.open .update-arrow{
  transform:rotate(180deg);
}

.update-body{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.25s ease;
}

.update-card.open .update-body{

}

.update-body-inner{

<script>

// ダークモード
const darkToggle = document.getElementById("darkToggle");
const savedDark = localStorage.getItem("darkMode");
if(savedDark === "true"){
  document.body.classList.add("dark");
}else if(savedDark === null){
  if(window.matchMedia("(prefers-color-scheme: dark)").matches){
    document.body.classList.add("dark");
  }
}
// html側にもクラスを反映（Safariでbodyの背景がスクロール全域に伸びきらない対策）
document.documentElement.classList.toggle("dark", document.body.classList.contains("dark"));

// 初回表示時もSafari再描画対策を行う（ページ遷移直後に背景が反映されない不具合対策）
if(document.body.classList.contains("dark")) forceRepaint();

function updateDarkBtn(){
  darkToggle.innerHTML =
    document.body.classList.contains("dark") ? icon("sun") : icon("moon");
}
updateDarkBtn();
darkToggle.onclick = ()=>{
  document.body.classList.toggle("dark");
  document.documentElement.classList.toggle("dark", document.body.classList.contains("dark"));
  localStorage.setItem("darkMode", document.body.classList.contains("dark"));
  updateDarkBtn();
  forceRepaint();
};

// ── 初回チュートリアル（スポットライト形式、js/tutorial.js） ──
const UPDATES_TUTORIAL_DONE_KEY = "hatopiUpdates_tutorialDone";
const UPDATES_TUTORIAL_STEPS = [
  { selector: "#updatesList", titleKey: "tutorial_updates_step1_title", titleFallback: "① タップして内容を確認", textKey: "tutorial_updates_step1_body", textFallback: "項目をタップすると、そのアプデ時のお知らせ内容が展開表示されます。新しい順に並んでいます。" },
  { selector: ".contact-box", titleKey: "tutorial_updates_step2_title", titleFallback: "② ご意見は匿名フォームへ", textKey: "tutorial_updates_step2_body", textFallback: "ご意見・ご要望・不具合報告は、匿名フォームからお気軽にどうぞ。" },
];
document.getElementById("helpBtn").innerHTML = icon("help");
function openHelpModal(){
  document.getElementById("helpModal").style.display = "block";
}
function closeHelpModal(){
  document.getElementById("helpModal").style.display = "none";
}

function forceRepaint(){
  // Safari/iPad再描画バグ対策
  document.body.style.display = "none";
  document.body.offsetHeight;
  document.body.style.display = "";
}

// 状態
let openId = null;

// 多言語ヘルパー
function currentLang(){
  return (window.i18n && typeof window.i18n.getCurrentLang === "function")
    ? window.i18n.getCurrentLang()
    : "ja";
}
function T(key, fallback, vars){
  if(window.i18n && typeof window.i18n.isReady === "function" && window.i18n.isReady()){
    return window.i18n.t(key, vars, fallback);
  }
  return fallback;
}
function displayField(obj, field){
  const i18nField = obj[field + "I18n"];
  if(!i18nField) return obj[field];
  const lang = currentLang();
  return i18nField[lang] || obj[field];
}

// 描画（新しい順）
function renderUpdates(){
  const el = document.getElementById("updatesList");
  el.innerHTML = "";

  const list = updatesData.slice().reverse();

  list.forEach(u => {
    const div = document.createElement("div");
    div.className = "update-card" + (openId === u.id ? " open" : "");
    div.innerHTML = `
      <div class="update-head" onclick="toggleUpdate(${u.id})">
        <span class="update-icon">${icon("bell", {size:15})}</span>
        <span class="update-head-text">
          <span class="update-date-badge">${u.date}</span>
          <div class="update-title">${displayField(u,"title")}</div>
        </span>
        <span class="update-arrow">▼</span>
      </div>
      <div class="update-body">
        <div class="update-body-inner">${displayField(u,"body")}</div>
      </div>
    `;
    el.appendChild(div);
  });
}

function toggleUpdate(id){
  openId = openId === id ? null : id;
  renderUpdates();
}

document.querySelectorAll(".btn-icon[data-icon]").forEach(el=>{
  el.innerHTML = icon(el.dataset.icon, {size:13});
});

renderUpdates();
maybeStartPageTutorial(UPDATES_TUTORIAL_DONE_KEY, UPDATES_TUTORIAL_STEPS);

// 言語切替時に再描画
document.addEventListener("langchange", renderUpdates);

</script>
