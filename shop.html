<style>
/* 商店ページ専用（他ページの.gridには影響しない） */
.shop-season-banner{
  background:var(--card);
  border:1px solid var(--gold);
  border-radius:14px;
  padding:10px 14px;
  margin-bottom:12px;
  font-size:12px;
  text-align:center;
  line-height:1.6;
}

.shop-season-banner.ended{
  border-color:var(--border);
  color:var(--text-sub);
}

.shop-progress{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px 14px;
  margin-bottom:16px;
  font-size:12px;
}

.shop-progress-track{
  flex:1;
  height:8px;
  border-radius:999px;
  background:var(--card-sub);
  overflow:hidden;
}

.shop-progress-fill{
  height:100%;
  background:var(--indigo);
  border-radius:999px;
  transition:width 0.2s;
}

body.dark .shop-progress-fill{ background:#8fbdc9; }

.shop-category-title{
  font-family:'Shippori Mincho', serif;
  font-size:15px;
  font-weight:700;
  color:var(--indigo);
  margin:22px 0 6px;
}

body.dark .shop-category-title{ color:#e8d2a8; }

.shop-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}

.shop-item-name{
  height:auto;
  min-height:34px;
  font-size:10.5px;
  line-height:1.3;
  padding:2px 0;
}

.shop-item-price{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
  font-weight:700;
  color:var(--vermillion);
  margin-top:2px;
}

body.dark .shop-item-price{ color:#e07060; }

.shop-item-limit{
  display:block;
  font-size:9px;
  color:var(--text-sub);
  margin-top:1px;
}
</style>
</head>

</div>

  <span id="shopProgressLabel">0 / 0</span>

  </div>
