<style>
/* 商店ページ専用（他ページの.gridには影響しない） */
.shop-season-block + .shop-season-block{
  margin-top:24px;
  padding-top:20px;
  border-top:1px dashed var(--border);
}

.shop-season-banner{
  background:var(--card);
  border:1px solid var(--gold);
  border-radius:14px;
  padding:10px 14px;
  margin-bottom:12px;
  font-size:12px;
  text-align:center;
  line-height:1.6;
}

.shop-season-banner.ended{
  border-color:var(--border);
  color:var(--text-sub);
}

body.dark .shop-season-banner{
  background:#2c2823;
  border-color:#46423b;
  color:#ece4d4;
}

body.dark .shop-season-banner.ended{
  border-color:#46423b;
  color:#b3a89a;
}

.shop-progress{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px 14px;
  margin-bottom:16px;
  font-size:12px;
}

body.dark .shop-progress{
  background:#2c2823;
  border-color:#46423b;
  color:#ece4d4;
}

.shop-progress-track{
  flex:1;
  height:8px;
  border-radius:999px;
  background:var(--card-sub);
  overflow:hidden;
}

body.dark .shop-progress-track{
  background:#383329;
}

.shop-progress-fill{
  height:100%;
  background:var(--indigo);
  border-radius:999px;
  transition:width 0.2s;
}

body.dark .shop-progress-fill{ background:#8fbdc9; }

.shop-category-title{
  font-family:'Shippori Mincho', serif;
  font-size:15px;
  font-weight:700;
  color:var(--indigo);
  margin:22px 0 6px;
}

body.dark .shop-category-title{ color:#e8d2a8; }

.shop-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}

/* 表示サイズ切り替え（小/中/大）。既定の「中」は上のグリッドのまま */
body[data-icon-size="small"] .shop-grid{
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
body[data-icon-size="large"] .shop-grid{
  grid-template-columns:repeat(1,1fr);
  gap:12px;
}

.shop-item-name{
  height:auto;
  min-height:34px;
  font-size:10.5px;
  line-height:1.3;
  padding:2px 0;
}

.shop-item-price{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
  font-weight:700;
  color:var(--vermillion);
  margin-top:2px;
}

body.dark .shop-item-price{ color:#e07060; }

.shop-item-limit{
  display:block;
  font-size:9px;
  color:var(--text-sub);
  margin-top:1px;
}

body.dark .shop-item-limit{
  color:#b3a89a;
}

.shop-controls{
  margin-bottom:14px;
}

.shop-reveal-wrap{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px 14px;
  margin-bottom:16px;
  text-align:center;
  font-size:12px;
  color:var(--text-sub);
  line-height:1.8;
}

body.dark .shop-reveal-wrap{
  background:#2c2823;
  border-color:#46423b;
  color:#b3a89a;
}

.shop-reveal-title{
  font-weight:700;
  color:var(--text);
  margin-bottom:4px;
}

body.dark .shop-reveal-title{
  color:#ece4d4;
}

.shop-reveal-btn{
  margin-top:8px;
  padding:7px 20px;
  border:1px solid var(--indigo);
  border-radius:999px;
  background:var(--indigo);
  color:#fdf9ef;
  font-size:12px;
  font-family:'Zen Maru Gothic', sans-serif;
  cursor:pointer;
}

body.dark .shop-reveal-btn{
  border-color:#8fbdc9;
  background:#8fbdc9;
  color:#22303a;
}

.shop-controls .search-wrap{
  margin-bottom:8px;
}

#shopClearBtn{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:1px solid var(--border);
  width:28px;
  height:28px;
  border-radius:50%;
  background:var(--card);
  box-shadow:0 2px 6px rgba(52,48,43,0.08);
  display:none;
  align-items:center;
  justify-content:center;
  color:var(--text-sub);
}

body.dark #shopClearBtn{
  background:#383329;
  color:#b3a89a;
  border-color:#46423b;
}
</style>
