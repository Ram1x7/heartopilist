<div class="page-header">
  <h2 data-i18n="art_convert_page_title">画像から作る</h2>
  <p data-i18n="art_convert_page_subtitle">画像をアップロードしてドット絵に変換します</p>
</div>

<div class="art-notice" data-i18n="art_coming_soon">
  現在開発中の機能です。今後のアップデートで順次使えるようになります。
</div>

<a href="./art-create.html" class="art-back-link">
  <span id="artBackIcon"></span>
  <span data-i18n="art_back_to_editor">エディターに戻る</span>
</a>

<div class="art-convert-layout">
  <div class="art-convert-upload" id="artUploadArea">
    <input type="file" id="artFileInput" accept="image/jpeg,image/png,image/webp" hidden>
    <button class="art-upload-btn" id="artUploadBtn">
      <span id="artUploadIcon"></span>
      <span data-i18n="art_choose_image">画像を選ぶ</span>
    </button>
    <p class="art-upload-hint" data-i18n="art_upload_hint">JPG・PNG・WebPに対応</p>
  </div>

  <div class="art-convert-preview" id="artConvertPreview" style="display:none;">
    <div class="art-preview-pair">
      <div class="art-preview-box">
        <div class="art-preview-label" data-i18n="art_original_label">元画像</div>
        <div class="art-preview-frame">
          <img id="artOriginalImg" alt="">
        </div>
      </div>
      <div class="art-preview-box">
        <div class="art-preview-label" data-i18n="art_result_label">ドット絵</div>
        <div class="art-preview-frame">
          <canvas id="artResultCanvas"></canvas>
        </div>
      </div>
    </div>
    <button class="art-header-btn art-use-btn" id="artUseInEditorBtn" data-i18n="art_use_in_editor">エディターで編集する</button>
  </div>

  <div class="art-panel" id="artConvertPanel" style="display:none;">
    <div class="art-panel-section">
      <div class="art-panel-title" data-i18n="art_convert_size_label">キャンバスサイズ</div>
      <div class="art-panel-title art-newcanvas-section-title" data-i18n="art_ratio_select_label">比率</div>
      <div class="art-gridsize-options" id="artConvertRatioOptions"></div>
      <div class="art-gridsize-options" id="artConvertFrameCategoryOptions"></div>
      <div class="art-gridsize-options art-scroll-options" id="artConvertFrameItemOptions"></div>
      <div class="art-gridsize-options" id="artConvertFramePartOptions" style="display:none"></div>
      <div class="art-panel-title art-newcanvas-section-title" data-i18n="art_size_select_label">サイズ</div>
      <div class="art-gridsize-options" id="artConvertLevelOptions"></div>
    </div>
    <div class="art-panel-section">
      <div class="art-panel-title" data-i18n="art_convert_preset_label">変換方式</div>
      <div class="art-preset-preview-row" id="artConvertPresetOptions"></div>
    </div>
    <div class="art-panel-section">
      <div class="art-panel-title" data-i18n="art_convert_fit_label">配置方法</div>
      <div class="art-gridsize-options" id="artConvertFitOptions"></div>
    </div>
    <div class="art-panel-section" id="artConvertFitBgRow" style="display:none">
      <div class="art-panel-title" data-i18n="art_convert_fit_bg_label">余白の色</div>
      <div class="art-gridsize-options" id="artConvertFitBgOptions"></div>
      <div class="art-custom-color" id="artConvertFitBgColorWrap" style="display:none; margin-top:8px;">
        <input type="color" id="artConvertFitBgColor" value="#ffffff">
      </div>
    </div>
    <div class="art-panel-section">
      <div class="art-panel-title" data-i18n="art_convert_colors_label">色数</div>
      <div class="art-gridsize-options" id="artConvertColorOptions"></div>
    </div>
    <div class="art-panel-section">
      <label class="art-toggle-row">
        <span data-i18n="art_convert_dither_label">ディザリング</span>
        <input type="checkbox" id="artDitherToggle">
      </label>
    </div>
    <div class="art-panel-section">
      <div class="art-panel-title" data-i18n="art_convert_edge_label">輪郭強調</div>
      <div class="art-gridsize-options" id="artConvertEdgeOptions"></div>
    </div>
    <div class="art-panel-section">
      <div class="art-panel-title" data-i18n="art_convert_brightness_label">明るさ</div>
      <input type="range" id="artBrightnessRange" min="-100" max="100" value="0">
    </div>
    <div class="art-panel-section">
      <div class="art-panel-title" data-i18n="art_convert_contrast_label">コントラスト</div>
      <input type="range" id="artContrastRange" min="-100" max="100" value="0">
    </div>
    <div class="art-panel-section">
      <div class="art-panel-title" data-i18n="art_convert_noise_label">ノイズ除去</div>
      <input type="range" id="artNoiseRange" min="0" max="100" value="0">
    </div>
    <div class="art-panel-section">
      <div class="art-panel-title" data-i18n="art_convert_bg_label">背景</div>
      <div class="art-gridsize-options" id="artConvertBgOptions"></div>
    </div>

<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
<script>

document.getElementById("artBackIcon").innerHTML = icon("chevronDown", { size: 14, className: "art-back-icon" });
document.getElementById("artUploadIcon").innerHTML = icon("upload", { size: 18 });

// ダークモード
const darkToggle = document.getElementById("darkToggle");
const savedDark = localStorage.getItem("darkMode");
if(savedDark === "true"){
  document.body.classList.add("dark");
}else if(savedDark === null){
  if(window.matchMedia("(prefers-color-scheme: dark)").matches){
    document.body.classList.add("dark");
  }
}
document.documentElement.classList.toggle("dark", document.body.classList.contains("dark"));
if(document.body.classList.contains("dark")) forceRepaint();

function updateDarkBtn(){
  darkToggle.innerHTML =
    document.body.classList.contains("dark") ? icon("sun") : icon("moon");
}
updateDarkBtn();
darkToggle.onclick = ()=>{
  document.body.classList.toggle("dark");
  document.documentElement.classList.toggle("dark", document.body.classList.contains("dark"));
  localStorage.setItem("darkMode", document.body.classList.contains("dark"));
  updateDarkBtn();
  forceRepaint();
  if(typeof renderResultPreview === "function" && typeof sourceImage !== "undefined" && sourceImage) convert();
};

function forceRepaint(){
  document.body.style.display = "none";
  document.body.offsetHeight;
  document.body.style.display = "";
}

function T(key, fallback, vars){
  if(window.i18n && typeof window.i18n.isReady === "function" && window.i18n.isReady()){
    return window.i18n.t(key, vars);
  }
  return fallback;
}

</script>
