  <button class="tab" id="cat-rainbow_day" onclick="setCat('rainbow_day')"></button>

<script>

// ダークモード
const darkToggle = document.getElementById("darkToggle");
const savedDark = localStorage.getItem("darkMode");
if(savedDark === "true"){
  document.body.classList.add("dark");
}else if(savedDark === null){
  if(window.matchMedia("(prefers-color-scheme: dark)").matches){
    document.body.classList.add("dark");
  }
}
// html側にもクラスを反映（Safariでbodyの背景がスクロール全域に伸びきらない対策）
document.documentElement.classList.toggle("dark", document.body.classList.contains("dark"));

// 初回表示時もSafari再描画対策を行う（ページ遷移直後に背景が反映されない不具合対策）
if(document.body.classList.contains("dark")) forceRepaint();

function updateDarkBtn(){
  darkToggle.innerHTML =
    document.body.classList.contains("dark") ? icon("sun") : icon("moon");
}
updateDarkBtn();
darkToggle.onclick = ()=>{
  document.body.classList.toggle("dark");
  document.documentElement.classList.toggle("dark", document.body.classList.contains("dark"));
  localStorage.setItem("darkMode", document.body.classList.contains("dark"));
  updateDarkBtn();
  forceRepaint();
};

function forceRepaint(){
  // Safari/iPad再描画バグ対策
  document.body.style.display = "none";
  document.body.offsetHeight;
  document.body.style.display = "";
}

// 多言語ヘルパー
function T(key, fallback, vars){
  if(window.i18n && typeof window.i18n.isReady === "function" && window.i18n.isReady()){
    return window.i18n.t(key, vars);
  }
  return fallback;
}

// カテゴリ定義
const CATS = {
  pink_bubble:   { label:()=>T("videos_cat_pink_bubble","ピンクバブル"), icon:"bubbles" },
  rainbow_day:   { label:()=>T("videos_cat_rainbow_day","虹の日"),       icon:"weatherRainbow" },
  meteor_shower: { label:()=>T("videos_cat_meteor_shower","流星雨"),     icon:"weatherMeteor" },
};

// 日付フォーマット（YYYY-MM-DD → YYYY/M/D）
function formatDate(str){
  const d = new Date(str + "T00:00:00");
  if(isNaN(d.getTime())) return str;
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

// カテゴリ内の動画を新しい順に並べたリストを返す
// ※同じ日付でも実際の発生開始時刻（メモから読み取り）が新しいものを上に表示する
//   （例：流星雨の同日「18:00~24:00」と「24:00~30:00」なら後者が上）
function getSortedList(cat){
  return (typeof videoData !== "undefined" ? videoData : [])
    .filter(v => v.category === cat)
    .slice()
    .sort((a, b) => {
      const sa = computeEventEnd(a)?.start ?? 0;
      const sb = computeEventEnd(b)?.start ?? 0;
      return sb - sa;
    });
}

function idOf(v, i){
  return v.category + "_" + v.date + "_" + i;
}

// "YYYY-MM-DD"（JST基準のカレンダー日付）を、そのJST 0:00に対応する絶対時刻(ms)に変換
// ※ブラウザのローカルタイムゾーンに依存させないため、UTC解釈から9時間分を差し引く
function jstMidnight(dateStr){
  const t = Date.parse(dateStr + "T00:00:00Z");
  return isNaN(t) ? NaN : t - 9 * 3600000;
}

// 各動画の「対象期間の開始・終了時刻」を求める（自動展開の判定に使用）
// ・ピンクバブル：dateの6:00始まり〜7日後6:00まで（メモは使わない）
// ・虹の日/流星雨：メモ内の「H:MM~H:MM」から開始・終了時刻を読み取る（読めない場合は当日いっぱいとみなす）
function computeEventEnd(v){
  const base = jstMidnight(v.date);
  if(isNaN(base)) return null;
  const HOUR = 3600000;

  if(v.category === "pink_bubble"){
    const start = base + 6 * HOUR;
    return { start, end: start + 7 * 24 * HOUR, windowMs: 0 };
  }

  const m = /^(\d{1,2}):(\d{2})\s*~\s*(\d{1,2}):(\d{2})/.exec(v.note || "");
  const start = m ? base + (parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) * 60000 : base;
  const end = m ? base + (parseInt(m[3], 10) * 60 + parseInt(m[4], 10)) * 60000 : base + 24 * HOUR;
  const windowMs = v.category === "meteor_shower" ? 24 * HOUR : 6 * HOUR;
  return { start, end, windowMs };
}

// タブを開いた直後、その動画を展開表示にすべきか（流星雨=開始から過去24時間、虹の日=開始から過去6時間、ピンクバブル=当該週内）
function isDefaultOpen(v){
  const info = computeEventEnd(v);
  if(!info) return false;
  const now = Date.now();
  if(info.windowMs === 0) return now >= info.start && now < info.end;
  return now >= info.start && now < info.start + info.windowMs;
}

// カテゴリ内で直近性の条件を満たす動画のidを全て返す（複数あれば全て開く）
function computeDefaultOpenIds(cat){
  const list = getSortedList(cat);
  const ids = [];
  list.forEach((v, i) => {
    if(isDefaultOpen(v)) ids.push(idOf(v, i));
  });
  return ids;
}

// 状態（他ページの「今日やること」などから ?cat=カテゴリ名 で直接開けるようにする）
const urlCat = new URLSearchParams(location.search).get("cat");
let currentCat = (urlCat && CATS[urlCat]) ? urlCat : "pink_bubble";
let openIds = new Set();

function setCat(cat){
  currentCat = cat;
  openIds = new Set(computeDefaultOpenIds(cat));
  Object.keys(CATS).forEach(c=>{
    document.getElementById("cat-"+c).classList.toggle("active", c === cat);
  });
  renderVideos();
}

function renderCatTabs(){
  Object.keys(CATS).forEach(c=>{
    const btn = document.getElementById("cat-"+c);
    btn.innerHTML = `${icon(CATS[c].icon,{size:14})} ${CATS[c].label()}`;
  });
}

// 描画
function renderVideos(){
  renderCatTabs();
  const el = document.getElementById("videoList");
  el.innerHTML = "";

  const list = getSortedList(currentCat);

  if(list.length === 0){
    el.innerHTML = `<div class="empty">${T("videos_no_results","まだ動画がありません")}</div>`;
    return;
  }

  list.forEach((v, i) => {
    const id = idOf(v, i);
    const isOpen = openIds.has(id);
    const div = document.createElement("div");
    div.className = "video-card" + (isOpen ? " open" : "");
    div.innerHTML = `
      <div class="video-question" onclick="toggleVideo('${id}')">
        <span class="video-icon">${icon("calendar", {size:15})}</span>
        <span class="video-title">${formatDate(v.date)}</span>
        <span class="video-arrow">▼</span>
      </div>
      <div class="video-answer">
        <div class="video-answer-inner">
          ${isOpen ? `
            <div class="video-embed">
              <iframe
                src="https://www.youtube-nocookie.com/embed/${v.videoId}"
                title="${formatDate(v.date)}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                loading="lazy"
              ></iframe>
            </div>
            ${v.note ? `<div class="video-note">${v.note}</div>` : ""}
          ` : ""}
        </div>
      </div>
    `;
    el.appendChild(div);
  });
}

function toggleVideo(id){
  if(openIds.has(id)) openIds.delete(id);
  else openIds.add(id);
  renderVideos();
}

setCat(currentCat);

// 言語切替時に再描画
document.addEventListener("langchange", renderVideos);

</script>
