<style>
/* codes.html 専用CSS（共通の見た目はcss/style.cssを参照） */
:root{
  --green:#4a7c59;
  --green-soft:#dff0e5;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{ min-height:100vh; }

/* タブ */
.tabs{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.tab{
  flex:1;
  padding:10px;
  border:1px solid var(--border);
  border-radius:999px;
  font-family:'Zen Maru Gothic', sans-serif;
  font-size:12px;
  background:var(--card-sub);
  color:var(--text-sub);
  cursor:pointer;
  transition:0.15s;
}

.tab.active{
  background:var(--indigo);
  border-color:var(--indigo);
  color:#fdf9ef;
  font-weight:700;
}

body.dark .tab{
  background:#383329;
  color:#b3a89a;
  border-color:#46423b;
}

body.dark .tab.active{
  background:var(--indigo-soft);
  border-color:var(--indigo-soft);
  color:#fdf9ef;
}

/* コードカード */
.code-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.code-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px 16px;
  box-shadow:0 4px 12px rgba(52,48,43,0.06);
}

body.dark .code-card{
  background:#2c2823;
  border-color:#46423b;
}

.code-card.expired{
  opacity:0.5;
}

.code-card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
}

.code-value{
  font-family:'Shippori Mincho', serif;
  font-size:17px;
  font-weight:700;
  color:var(--indigo);
  letter-spacing:0.08em;
}

body.dark .code-value{
  color:#e8d2a8;
}

.code-badge{
  font-size:10px;
  padding:3px 10px;
  border-radius:999px;
  font-weight:700;
  white-space:nowrap;
}

.badge-active{
  background:var(--green-soft);
  color:var(--green);
  border:1px solid var(--green);
}

body.dark .badge-active{
  background:#1e3328;
  color:#7ec89a;
  border-color:#4a7c59;
}

.badge-expired{
  background:var(--card-sub);
  color:var(--text-sub);
  border:1px solid var(--border);
}

body.dark .badge-expired{
  background:#383329;
  color:#b3a89a;
  border-color:#46423b;
}

.code-reward{
  font-size:12px;
  color:var(--text);
  margin-bottom:6px;
  line-height:1.6;
  display:flex;
  align-items:center;
  gap:4px;
}

body.dark .code-reward{
  color:#ece4d4;
}

.code-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.code-expiry{
  font-size:10px;
  color:var(--text-sub);
}

body.dark .code-expiry{
  color:#b3a89a;
}

/* コピーボタン */
.copy-btn{
  padding:6px 14px;
  border:1px solid var(--indigo);
  border-radius:999px;
  font-family:'Zen Maru Gothic', sans-serif;
  font-size:11px;
  background:var(--indigo);
  color:#fdf9ef;
  cursor:pointer;
  transition:0.15s;
  white-space:nowrap;
}

.copy-btn:active{
  opacity:0.75;
  transform:scale(0.97);
}

.copy-btn.copied{
  background:var(--green);
  border-color:var(--green);
}

.code-card.expired .copy-btn{
  background:var(--card-sub);
  border-color:var(--border);
  color:var(--text-sub);
  pointer-events:none;
}

body.dark .code-card.expired .copy-btn{
  background:#383329;
  border-color:#46423b;
  color:#b3a89a;
}

/* 空表示 */
.empty{
  text-align:center;
  padding:40px 0;
  color:var(--text-sub);
  font-size:13px;
}

body.dark .empty{
  color:#b3a89a;
}

/* フッター */
.footer{
  text-align:center;
  margin-top:24px;
  font-size:10px;
  color:var(--text-sub);
  opacity:0.6;
  line-height:1.8;
}

body.dark .footer{
  color:#b3a89a;
}

/* トースト */
#toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--indigo);
  color:#fdf9ef;
  padding:10px 22px;
  border-radius:999px;
  font-size:13px;
  opacity:0;
  transition:opacity 0.25s, transform 0.25s;
  pointer-events:none;
  z-index:1000;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* 受け取り済みカード */
.code-card.received{
  border-color:var(--green);
  background:var(--green-soft);
}

body.dark .code-card.received{
  border-color:#4a7c59;
  background:#1e3328;
}

/* 受取ボタン */
.receive-btn{
  padding:6px 12px;
  border:1px solid var(--border);
  border-radius:999px;
  font-family:'Zen Maru Gothic', sans-serif;
  font-size:11px;
  background:var(--card-sub);
  color:var(--text-sub);
  cursor:pointer;
  transition:0.15s;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:4px;
}

body.dark .receive-btn{
  background:#383329;
  color:#b3a89a;
  border-color:#46423b;
}

.receive-btn.received{
  background:var(--green-soft);
  border-color:var(--green);
  color:var(--green);
  font-weight:700;
}

body.dark .receive-btn.received{
  background:#1e3328;
  border-color:#4a7c59;
  color:#7ec89a;
}

.receive-btn:active{
  transform:scale(0.97);
}


</style>

</div>

<script src="js/data-codes.js"></script>
<script>
// ダークモード
const darkToggle = document.getElementById("darkToggle");
const savedDark = localStorage.getItem("darkMode");
if(savedDark === "true"){
  document.body.classList.add("dark");
}else if(savedDark === null){
  if(window.matchMedia("(prefers-color-scheme: dark)").matches){
    document.body.classList.add("dark");
  }
}
// html側にもクラスを反映（Safariでbodyの背景がスクロール全域に伸びきらない対策）
document.documentElement.classList.toggle("dark", document.body.classList.contains("dark"));

// 初回表示時もSafari再描画対策を行う（ページ遷移直後に背景が反映されない不具合対策）
if(document.body.classList.contains("dark")) forceRepaint();

function updateDarkBtn(){
  darkToggle.innerHTML =
    document.body.classList.contains("dark") ? icon("sun") : icon("moon");
}
updateDarkBtn();
darkToggle.onclick = ()=>{
  document.body.classList.toggle("dark");
  document.documentElement.classList.toggle("dark", document.body.classList.contains("dark"));
  localStorage.setItem("darkMode", document.body.classList.contains("dark"));
  updateDarkBtn();
  forceRepaint();
};

function forceRepaint(){
  // Safari/iPad再描画バグ対策
  document.body.style.display = "none";
  document.body.offsetHeight;
  document.body.style.display = "";
}

// タブ
let currentTab = "active";
function setTab(tab){
  currentTab = tab;
  ["active","expired"].forEach(t=>{
    document.getElementById("tab-"+t).classList.toggle("active", t === tab);
  });
  renderCodes();
}

// 期限チェック
function isExpired(expiry){
  if(!expiry) return false;
  // "YYYY-MM-DD HH:MM" → そのままDateに渡せるよう":"はそのままでOK
  return new Date(expiry) < new Date();
}

// 多言語ヘルパー
function currentLang(){
  return (window.i18n && typeof window.i18n.getCurrentLang === "function")
    ? window.i18n.getCurrentLang()
    : "ja";
}
function T(key, fallback, vars){
  if(window.i18n && typeof window.i18n.isReady === "function" && window.i18n.isReady()){
    return window.i18n.t(key, vars);
  }
  return fallback;
}
function displayReward(c){
  const lang = currentLang();
  const text = (c.rewardI18n && c.rewardI18n[lang]) || c.reward;
  return injectCurrencyIcons(text);
}


// コード描画
// チェック状態の読み込み
let receivedCodes =
  JSON.parse(localStorage.getItem("receivedCodes") || "{}");

function renderCodes(){
  const el = document.getElementById("codeList");
  el.innerHTML = "";

  const list = codesData
  .filter(c =>
    currentTab === "active"
      ? !isExpired(c.expiry) && c.active
      : isExpired(c.expiry) || !c.active
  )
  .sort((a, b) => {
    const ar = receivedCodes[a.code] ? 1 : 0;
    const br = receivedCodes[b.code] ? 1 : 0;
    return ar - br;
  });

  if(list.length === 0){
    el.innerHTML = `<div class="empty">${
      currentTab === "active"
        ? T("codes_no_active","現在有効なコードはありません")
        : T("codes_no_expired","期限切れのコードはありません")
    }</div>`;
    return;
  }

  list.forEach(c=>{
    const expired = isExpired(c.expiry) || !c.active;
    const received = !!receivedCodes[c.code];
    const div = document.createElement("div");
    div.className = "code-card" + (expired ? " expired" : "") + (received ? " received" : "");
    div.innerHTML = `
      <div class="code-card-top">
        <span class="code-value">${c.code}</span>
        <span class="code-badge ${expired ? "badge-expired" : "badge-active"}">
          ${expired ? T("codes_badge_expired","期限切れ") : T("codes_badge_active","有効")}
        </span>
      </div>
      <div class="code-reward">${icon("gift",{size:13})} ${displayReward(c)}</div>
      <div class="code-meta">
        <span class="code-expiry">
           ${c.expiry ? T("codes_expiry_label","期限：") + formatExpiry(c.expiry) : T("codes_expiry_none","期限：なし")}
        </span>
        <div style="display:flex; gap:8px; align-items:center;">
          <button
            class="receive-btn ${received ? "received" : ""}"
            onclick="toggleReceived('${c.code}')"
            title="${T("codes_receive_title","受け取り済みにする")}"
          >${received ? `${icon("check",{size:12})} ${T("codes_received","受取済")}` : T("codes_not_received","○ 未受取")}</button>
          <button
            class="copy-btn ${expired ? "" : ""}"
            onclick="copyCode('${c.code}', this)"
            ${expired ? "disabled" : ""}
          >${expired ? T("codes_badge_expired","期限切れ") : T("codes_copy","コピー")}</button>
        </div>
      </div>
    `;
    el.appendChild(div);
  });
}

function toggleReceived(code){
  receivedCodes[code] = !receivedCodes[code];
  localStorage.setItem("receivedCodes", JSON.stringify(receivedCodes));
  renderCodes();
}


// コピー
function copyCode(code, btn){
  navigator.clipboard.writeText(code).then(()=>{
    btn.textContent = T("codes_copied","コピー済み");
    btn.classList.add("copied");
    setTimeout(()=>{
      btn.textContent = T("codes_copy","コピー");
      btn.classList.remove("copied");
    }, 2000);
    showToast(T("codes_copied_toast","コピーしました！"));
  }).catch(()=>{
    // フォールバック
    const ta = document.createElement("textarea");
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    showToast(T("codes_copied_toast","コピーしました！"));
  });
}

function formatExpiry(expiry){
  if(!expiry) return T("codes_expiry_none","なし");
  const d = new Date(expiry);
  const yyyy = d.getFullYear();
  const mm = d.getMonth() + 1;
  const dd = d.getDate();
  const hh = String(d.getHours()).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");
  const suffix = T("codes_expiry_until","まで");
  return suffix ? `${yyyy}/${mm}/${dd} ${hh}:${min}${suffix}` : `${yyyy}/${mm}/${dd} ${hh}:${min}`;
}


// トースト
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 2000);
}

renderCodes();

// 言語切替時に再描画
document.addEventListener("langchange", renderCodes);

</script>
